version: '3.8'

services:
  # ------------------------------------------------------------------------------
  # Core Infrastructure
  # ------------------------------------------------------------------------------
  postgres-postgis:
    image: postgis/postgis:16-3.4
    container_name: drch_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-drch_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/db/seeds/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: drch_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: drch_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672" # Admin UI
    restart: unless-stopped

  # ------------------------------------------------------------------------------
  # Application Services
  # ------------------------------------------------------------------------------
  frontend:
    image: drch_frontend:latest
    build:
      context: ./frontend
    container_name: drch_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  backend:
    image: drch_backend:latest
    build:
      context: ./backend
    container_name: drch_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres-postgis:5432/${POSTGRES_DB:-drch_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev_insecure_jwt_secret_key_minimum_32_characters_for_local_compose}
    volumes:
      - ./backend:/app
    depends_on:
      - postgres-postgis
      - redis
      - rabbitmq

  ai-workers:
    image: drch_ai_workers:latest
    build:
      context: ./ai-workers
    container_name: drch_ai_workers
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./ai-workers:/app
    depends_on:
      - rabbitmq
      - redis

volumes:
  pgdata:
