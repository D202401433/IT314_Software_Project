name: Continuous Integration (CI)

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Frontend Quality & Linting
  # ============================================================================
  frontend-check:
    name: Frontend / Static Analysis & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ============================================================================
  # 2. Python Backend & AI Workers Quality Scan
  # ============================================================================
  python-check:
    name: Python / Lint & Security Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install code quality and security tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Run Ruff linter and formatter check
        run: ruff check backend/ ai-workers/

      - name: Run Bandit security scan (SAST)
        run: bandit -r backend/ ai-workers/ -ll -ii

  # ============================================================================
  # 3. Database Schema Validation & Cryptographic Triggers (PostgreSQL 16 + PostGIS)
  # ============================================================================
  database-schema-validation:
    name: Database / Schema & Trigger Integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drch_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and apply schema migrations
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db \
            -f backend/db/migrations/01_schema.sql \
            -v ON_ERROR_STOP=1
          echo "Database schema compiled successfully with zero DDL or constraint errors."
        env:
          PGPASSWORD: postgres

      - name: Verify audit log cryptographic hash trigger
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO audit_logs (action, entity_type, result, rationale)
          VALUES ('CI_VERIFY_TRIGGER', 'system', 'SUCCESS', 'CI pipeline hash chain check');

          DO $$
          DECLARE
            v_hash TEXT;
          BEGIN
            SELECT row_hash INTO v_hash FROM audit_logs WHERE action = 'CI_VERIFY_TRIGGER';
            IF v_hash IS NULL OR length(v_hash) <> 64 THEN
              RAISE EXCEPTION 'Audit hash chain trigger failed: invalid row_hash';
            END IF;
          END;
          $$;
          SQL
          echo "Cryptographic audit hash chain trigger verified successfully."
        env:
          PGPASSWORD: postgres

  # ============================================================================
  # 4. Backend Unit & API Smoke Tests
  # ============================================================================
  backend-tests:
    name: Backend / Unit Tests & API Verification
    runs-on: ubuntu-latest
    needs: python-check
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run test suite
        run: |
          if [ -d "tests" ] && [ "$(find tests -name 'test_*.py' | head -1)" ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "No test suite found in backend/tests/ — running smoke test"
            python -c "from main import app; print('FastAPI app imports successfully')"
          fi

  # ============================================================================
  # 5. Fast Container Build Validation & Trivy Vulnerability Scan
  # ============================================================================
  container-validation:
    name: Container / Build & Security Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image_name: drch_frontend
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image_name: drch_backend
          - name: ai-workers
            context: ./ai-workers
            file: ./ai-workers/Dockerfile
            image_name: drch_ai_workers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for vulnerability scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ matrix.image_name }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ matrix.image_name }}:test
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          cache: true

  # ============================================================================
  # 6. CI Pipeline Gatekeeper (Blocking Status Check for PR Merge)
  # ============================================================================
  ci-gatekeeper:
    name: Pipeline Status / Quality Gate
    runs-on: ubuntu-latest
    needs:
      - frontend-check
      - python-check
      - database-schema-validation
      - backend-tests
      - container-validation
    if: always()
    steps:
      - name: Evaluate pipeline execution status
        run: |
          if [ "${{ needs.frontend-check.result }}" != "success" ] || \
             [ "${{ needs.python-check.result }}" != "success" ] || \
             [ "${{ needs.database-schema-validation.result }}" != "success" ] || \
             [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.container-validation.result }}" != "success" ]; then
            echo "CI check failed: one or more verification jobs did not succeed."
            exit 1
          fi
          echo "CI check passed: all validation and security jobs succeeded."
