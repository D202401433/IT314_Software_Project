name: DRCH Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1

jobs:
  # ============================================================================
  # 1. Frontend Quality & Linting
  # ============================================================================
  frontend-check:
    name: Frontend Lint & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ============================================================================
  # 2. Python Backend & AI Workers Quality Scan
  # ============================================================================
  python-check:
    name: Python Lint & SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12 with pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Code Quality & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Run Ruff Linter & Formatter Check
        run: ruff check backend/ ai-workers/

      - name: Python SAST Security Scan (Bandit)
        run: bandit -r backend/ ai-workers/ -ll -ii

  # ============================================================================
  # 3. Database Schema Validation & Cryptographic Triggers (PostgreSQL 16 + PostGIS)
  # ============================================================================
  database-schema-validation:
    name: Database Schema & Trigger Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drch_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile and Apply DDL Schema (01_schema.sql)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db \
            -f backend/db/migrations/01_schema.sql \
            -v ON_ERROR_STOP=1
          echo "Database schema compiled successfully with zero DDL or constraint errors."
        env:
          PGPASSWORD: postgres

      - name: Verify Tamper-Evident Hash Chain Trigger (AM-FR-05)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO audit_logs (action, entity_type, result, rationale)
          VALUES ('CI_VERIFY_TRIGGER', 'system', 'SUCCESS', 'CI pipeline hash chain check');

          DO $$
          DECLARE
            v_hash TEXT;
          BEGIN
            SELECT row_hash INTO v_hash FROM audit_logs WHERE action = 'CI_VERIFY_TRIGGER';
            IF v_hash IS NULL OR length(v_hash) <> 64 THEN
              RAISE EXCEPTION 'Audit hash chain trigger failed: invalid row_hash';
            END IF;
          END;
          $$;
          SQL
          echo "Cryptographic audit hash chain trigger verified successfully."
        env:
          PGPASSWORD: postgres

  # ============================================================================
  # 4. Backend Unit & API Smoke Tests
  # ============================================================================
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: python-check
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12 with pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Backend Tests
        run: |
          if [ -d "tests" ] && [ "$(find tests -name 'test_*.py' | head -1)" ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "No test suite found in backend/tests/ — running smoke test"
            python -c "from main import app; print('FastAPI app imports successfully')"
          fi

  # ============================================================================
  # 5. Container Build & Security Scan (Parallel Matrix with Docker Buildx & GHA Cache)
  #    Runs concurrently with linting/SAST/DB validation (no unnecessary needs dependency)
  #    Verifies full multi-stage Docker builds (including Next.js standalone build)
  # ============================================================================
  container-security:
    name: Container Build & Security Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image: drch_frontend:latest
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image: drch_backend:latest
          - name: ai-workers
            context: ./ai-workers
            file: ./ai-workers/Dockerfile
            image: drch_ai_workers:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image with Buildx GHA Cache
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability Scan with Trivy (${{ matrix.name }})
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ matrix.image }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================================
  # 6. CI Pipeline Gatekeeper (Blocking Job for Merge Verification)
  #    Requires all parallel tracks (linting, SAST, tests, DB, containers) to pass
  # ============================================================================
  ci-gatekeeper:
    name: CI Pipeline Status Check (Gatekeeper)
    runs-on: ubuntu-latest
    needs:
      - frontend-check
      - python-check
      - database-schema-validation
      - backend-tests
      - container-security
    if: always()
    steps:
      - name: Verify All Pipeline Jobs Succeeded
        run: |
          if [ "${{ needs.frontend-check.result }}" != "success" ] || \
             [ "${{ needs.python-check.result }}" != "success" ] || \
             [ "${{ needs.database-schema-validation.result }}" != "success" ] || \
             [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.container-security.result }}" != "success" ]; then
            echo "❌ CI failed: One or more prerequisite jobs failed or were cancelled."
            exit 1
          fi
          echo "✅ All CI quality checks, tests, builds, and security scans completed successfully."
