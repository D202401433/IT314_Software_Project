name: Continuous Integration (CI)

on:
  push:
    branches-ignore: [ "main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Frontend Quality & Linting
  # ============================================================================
  frontend-check:
    name: Frontend / Static Analysis & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        # Run lint but only fail on errors, not warnings
        run: npm run lint -- --max-warnings=9999

  # ============================================================================
  # 2. Python Backend & AI Workers Quality Scan
  # ============================================================================
  python-check:
    name: Python / Lint & Security Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install code quality and security tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Run Ruff linter (errors only, skip formatting)
        # E9=syntax errors, F63/F7/F82=fatal pyflakes – all other rules are warnings
        run: ruff check backend/ ai-workers/ --select E9,F63,F7,F82 --no-fix

      - name: Run Bandit security scan (SAST – medium+high severity only)
        # -ll = report only medium+high, -ii = report only high-confidence findings
        # noqa-style: skip B101 (assert), B311 (random), common false positives
        run: >
          bandit -r backend/ ai-workers/
          -ll -ii
          --skip B101,B311,B105,B106,B107,B301,B403,B404,B603,B607

  # ============================================================================
  # 3. Database Schema Validation & Cryptographic Triggers (PostgreSQL 16 + PostGIS)
  # ============================================================================
  database-schema-validation:
    name: Database / Schema & Trigger Integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drch_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres && break
            echo "Waiting for PostgreSQL... attempt $i"
            sleep 2
          done
        env:
          PGPASSWORD: postgres

      - name: Compile and apply schema migrations
        run: |
          for file in $(find backend/db/migrations -maxdepth 1 -name '*.sql' | sort -V); do
            echo "Applying migration: $file"
            PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db \
              -f "$file" \
              -v ON_ERROR_STOP=1
          done
          echo "All database schema migrations compiled successfully with zero DDL or constraint errors."
        env:
          PGPASSWORD: postgres

      - name: Verify audit log cryptographic hash trigger
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d drch_test_db -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO audit_logs (action, entity_type, result, rationale)
          VALUES ('CI_VERIFY_TRIGGER', 'system', 'SUCCESS', 'CI pipeline hash chain check');

          DO $$
          DECLARE
            v_hash TEXT;
          BEGIN
            SELECT row_hash INTO v_hash FROM audit_logs WHERE action = 'CI_VERIFY_TRIGGER';
            IF v_hash IS NULL OR length(v_hash) <> 64 THEN
              RAISE EXCEPTION 'Audit hash chain trigger failed: invalid row_hash (got: %)', COALESCE(v_hash, 'NULL');
            END IF;
            RAISE NOTICE 'Audit hash chain verified: %', v_hash;
          END;
          $$;
          SQL
          echo "Cryptographic audit hash chain trigger verified successfully."
        env:
          PGPASSWORD: postgres

  # ============================================================================
  # 4. Backend Unit & API Smoke Tests
  # ============================================================================
  backend-tests:
    name: Backend / Unit Tests & API Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      JWT_SECRET: "ci_pipeline_jwt_secret_token_minimum_32_characters_key"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run test suite or smoke test
        run: |
          if [ -d "tests" ] && [ "$(find tests -name 'test_*.py' | head -1)" ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "No test suite found in backend/tests/ — running smoke test"
            python -c "from main import app; print('FastAPI app imports successfully')"
          fi

  # ============================================================================
  # 5. Fast Container Build Validation
  # ============================================================================
  container-validation:
    name: Container / Build Validation (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Non-blocking: Docker builds can fail due to layer timeouts; don't gate PR merge on this
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image_name: drch_backend
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image_name: drch_frontend
          - name: ai-workers
            context: ./ai-workers
            file: ./ai-workers/Dockerfile
            image_name: drch_ai_workers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ matrix.image_name }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan (informational)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ matrix.image_name }}:test
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          cache: true

  # ============================================================================
  # 6. CI Pipeline Gatekeeper (Blocking Status Check for PR Merge)
  # ============================================================================
  ci-gatekeeper:
    name: Pipeline Status / Quality Gate
    runs-on: ubuntu-latest
    needs:
      - frontend-check
      - python-check
      - database-schema-validation
      - backend-tests
      - container-validation
    if: always()
    steps:
      - name: Evaluate pipeline execution status
        run: |
          echo "=== CI Job Results ==="
          echo "frontend-check:             ${{ needs.frontend-check.result }}"
          echo "python-check:               ${{ needs.python-check.result }}"
          echo "database-schema-validation: ${{ needs.database-schema-validation.result }}"
          echo "backend-tests:              ${{ needs.backend-tests.result }}"
          echo "container-validation:       ${{ needs.container-validation.result }}"
          echo "======================"

          FAILED=""
          [ "${{ needs.frontend-check.result }}" != "success" ] && FAILED="$FAILED frontend-check"
          [ "${{ needs.python-check.result }}" != "success" ] && FAILED="$FAILED python-check"
          [ "${{ needs.database-schema-validation.result }}" != "success" ] && FAILED="$FAILED database-schema-validation"
          [ "${{ needs.backend-tests.result }}" != "success" ] && FAILED="$FAILED backend-tests"
          [ "${{ needs.container-validation.result }}" != "success" ] && FAILED="$FAILED container-validation"

          if [ -n "$FAILED" ]; then
            echo "CI check FAILED: the following job(s) did not succeed: $FAILED"
            exit 1
          fi
          echo "CI check PASSED: all required validation and security jobs succeeded."
