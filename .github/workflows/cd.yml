name: Continuous Deployment (CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILDKIT: 1

jobs:
  # ============================================================================
  # 1. Build and Publish Containers to GHCR
  # ============================================================================
  publish-containers:
    name: Publish Container to GHCR (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image_name: drch_frontend
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image_name: drch_backend
          - name: ai-workers
            context: ./ai-workers
            file: ./ai-workers/Dockerfile
            image_name: drch_ai_workers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push verified container to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. Production Deployment Verification
  # ============================================================================
  deploy:
    name: Continuous Deployment / Deploy to Production
    runs-on: ubuntu-latest
    needs: publish-containers
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Deployment Manifest & Production Readiness
        run: |
          echo "========================================================"
          echo "Initiating automated deployment sequence for commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
          echo "Target Registry: ghcr.io/${{ github.repository }}"
          echo "========================================================"
          if [ -f "docker-compose.prod.yml" ]; then
            echo "Production Docker Compose manifest verified: docker-compose.prod.yml"
          else
            echo "Missing docker-compose.prod.yml manifest"
            exit 1
          fi
          echo "Production deployment readiness verification complete."
