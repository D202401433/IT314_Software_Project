services:
  - type: web
    name: drch-backend
    runtime: image
    image:
      url: ghcr.io/siddhcreator-1706/it314_software_project/drch_backend:latest
    plan: free
    region: ohio
    autoDeploy: false

    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
