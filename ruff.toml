# ruff.toml — Python linting configuration for backend/ and ai-workers/
# Only surface real errors; the CI job uses --select E9,F63,F7,F82 (syntax + fatal)
# so this file documents the intent and provides consistent local-dev behaviour.

line-length = 120
target-version = "py312"

[lint]
# Fatal errors only — matches CI invocation:
#   E9xx  = runtime/syntax errors
#   F63x  = invalid star expressions, etc.
#   F7xx  = syntax errors caught by pyflakes
#   F82x  = undefined names
select = ["E9", "F63", "F7", "F82"]
ignore = []

# Don't require type annotations on simple functions
[lint.pydocstyle]
convention = "google"
